name: Release to PyPI
on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify versioning
        run: |
          [ "$(grep '^version =' pyproject.toml | head -1 | sed "s/version *= *['\"]//g" | sed "s/['\"] *$//g")" == "${GITHUB_REF#refs/tags/v}" ]
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest
      - name: Build packages
        run: uvx build
      - name: Publish to PyPI
        if: ${{ github.event_name == 'release' }}
        uses: pypa/gh-action-pypi-publish@release/v1
