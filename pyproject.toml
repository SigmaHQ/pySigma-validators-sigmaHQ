[project]
name = "pySigma-validators-sigmahq"
version = "0.20.3"
description = "pySigma SigmaHQ validators"
license = "LGPL-2.1-only"
readme = "README.md"
requires-python = ">=3.10,<4.0"

authors = [
    {name = "François Hubaut", email = "frack113@users.noreply.github.com" }
]

maintainers = [
    {name = "François Hubaut", email = "frack113@users.noreply.github.com" },
    {name = "Christian Burkard", email = "phantinuss@users.noreply.github.com" }
]

keywords = [ "pySigma", "SigmaHQ", "validators"]

dependencies = [
    "pysigma >=1.3",
    "requests >=2.34"
]

[project.urls]
repository = "https://github.com/SigmaHQ/pySigma_validators_sigmaHQ"

[tool.poetry]
packages = [
    { include = "sigma" }
]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.12,<1"
defusedxml = "^0.7"
pytest = "^9.1"
pytest-cov = "^7.1"
mypy = "^2.0"
check-jsonschema = "^0.29"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I001"]
ignore = ["E501", "W291", "W293", "W29"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "PLR2004"]
"tools/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytest.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
